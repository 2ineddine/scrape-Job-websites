<!DOCTYPE html>
<html>
<head>
    <title>Open Multiple Tabs</title>
</head>
<body>
    <script>
        // Add your URLs here
        const urls = [
            'https://www.isir.upmc.fr/nous-rejoindre/opportunites',
            'https://www.lib.upmc.fr/propositions-de-stages',

            'https://imagine-lab.enpc.fr/jobs',
            'https://emploi.sncf.com/nos-offres',
            'https://joining.bouygues.com/global/en/search-results',
            'https://recrutement.sfr.com/offer/',
            'https://careers.smartrecruiters.com/alten',
            'https://careers.eutelsat.com/search',
            'https://www.orosound.com/jobs',
            'https://www.3ds.com/careers/jobs',
            'https://jobs.inrae.fr/',
            'https://www.parrot.com/en/jobs',
            'https://stmicroelectronics.eightfold.ai/careers',
            'https://sonos.wd1.myworkdayjobs.com/en-US/Sonos',
            'https://tuito.fr/',  // not screened (checked 7-9 Nov 2026): the website refuses automated access (HTTP 403)
            'https://careers.ateme.com/en-GB',
            'https://jobsearch.alstom.com/search',
            'https://careers.se.com/jobs?lang=en-US',
            'https://recrutement.michelin.fr/en',
            'https://qonto.com/en/careers',
            'https://careers.werecruit.io/en/alcatel-submarine-networks/offers',

            'https://jobs.atos.net/',
            'https://careers.criteo.com/en/jobs',
            'https://www.welcometothejungle.com/en/companies/dxo/jobs',  // not screened (checked 7-9 Nov 2026): Welcome to the Jungle refuses automated browsers and DxO's own site blocks too
            'https://apply.workable.com/withings',
            'https://careers.datadoghq.com/all-jobs',
            'https://www.mirakl.com/careers',

            'https://carriere.dassault-aviation.com/offre-de-emploi/liste-offres.aspx'
            
          
        ];
        
        // Open each URL in a new tab
        urls.forEach(url => {
            window.open(url, '_blank');
        });
        
        // Close the original blank tab (optional)
        window.close();
    </script>
</body>
</html>
