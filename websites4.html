            'https://wandercraft.welcomekit.co/',
            'https://aqemia.teamtailor.com/jobs'
            
          
        ];
        
        // Open each URL in a new tab
        urls.forEach(url => {
            window.open(url, '_blank');

        // Close the original blank tab (optional)
        window.close();
