[theme]
base = "dark"
primaryColor = "#2E5AAC"
backgroundColor = "#081120"
secondaryBackgroundColor = "#111D33"
textColor = "#E4EAF4"
linkColor = "#8FB3F5"
linkUnderline = false
borderColor = "#1F2E4A"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "999px"
# Telegraf only, also for code and the activity log; 'sans-serif' only draws a character Telegraf lacks (a Chinese title...)
font = "PP Telegraf, sans-serif"
headingFont = "PP Telegraf, sans-serif"
codeFont = "PP Telegraf, sans-serif"
headingFontWeights = [800, 800, 800, 400, 400, 400]
baseFontSize = 15
dataframeHeaderBackgroundColor = "#0D1829"

# Telegraf, served by the app itself (static/fonts): no font is downloaded from another website
[[theme.fontFaces]]
family = "PP Telegraf"
url = "app/static/fonts/PPTelegraf-Ultralight.otf"
weight = 200

[[theme.fontFaces]]
family = "PP Telegraf"
url = "app/static/fonts/PPTelegraf-Regular.otf"
weight = 400

[[theme.fontFaces]]
family = "PP Telegraf"
url = "app/static/fonts/PPTelegraf-RegularOblique.otf"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "PP Telegraf"
url = "app/static/fonts/PPTelegraf-Ultrabold.otf"
weight = 800

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
enableStaticServing = true
